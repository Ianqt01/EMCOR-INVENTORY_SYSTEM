<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMCOR - Stock In</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <div id="app-shell-nav"></div>
    <div class="main">
      <div class="content" style="max-width:560px;">
        <h2 class="page-title">Stock in</h2>
        <div id="msgBox"></div>
        <form id="stockInForm">
          <div class="field">
            <label>Product</label>
            <select id="siProduct" required></select>
          </div>
          <div class="field">
            <label>Supplier</label>
            <select id="siSupplier" required></select>
          </div>
          <div class="field"><label>Quantity</label><input type="number" id="siQty" required></div>
          <div class="field"><label>Cost Price</label><input type="number" step="0.01" id="siCost" required></div>
          <div class="field"><label>Reference Number</label><input type="text" id="siRef"></div>
          <button type="submit" class="btn">Save stock in</button>
        </form>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="nav.js"></script>
  <script src="stockin.js"></script>
</body>
</html>
