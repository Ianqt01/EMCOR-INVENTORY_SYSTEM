<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMCOR - Stock Out</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <div id="app-shell-nav"></div>
    <div class="main">
      <div class="content" style="max-width:560px;">
        <h2 class="page-title">Stock out & sales</h2>
        <div id="msgBox"></div>
        <form id="stockOutForm">
          <div class="field">
            <label>Product</label>
            <select id="soProduct" required></select>
          </div>
          <div class="field"><label>Quantity</label><input type="number" id="soQty" required></div>
          <div class="field"><label>Selling Price</label><input type="number" step="0.01" id="soPrice" required></div>
          <div class="field"><label>Customer Name</label><input type="text" id="soCustomer"></div>
          <div class="field"><label>Reference Number</label><input type="text" id="soRef"></div>
          <button type="submit" class="btn">Save stock out</button>
        </form>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="nav.js"></script>
  <script src="stockout.js"></script>
</body>
</html>
